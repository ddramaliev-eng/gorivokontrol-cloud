{% extends "base.html" %}
{% block title %}Вход - GorivoKontrol Cloud{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3 text-center">⛽ GorivoKontrol Cloud</h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Парола</label>
            <input type="password" name="password" class="form-control" autofocus required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Вход</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
